<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuakeMap</title>
  <meta name="description" content="نقشهٔ زندهٔ زمین‌لرزه‌های جهان با دادهٔ USGS. فیلتر بزرگی، عمق، زمان، ایران و خاورمیانه." />
  <meta name="theme-color" content="#101114" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23181b20'/%3E%3Cpath d='M4 17h6l3-9 5 16 3-7h7' fill='none' stroke='%23ececef' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- جلوگیری از پرش رنگ هنگام بارگذاری: تم ذخیره‌شده را زودتر اعمال می‌کند -->
  <script>
    try {
      var t = localStorage.getItem("rasad-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
        </span>
        <div>
          <h1>کویک مپ</h1>
          <p>نقشه زنده زمین‌لرزه</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="live" id="live"><i></i><span id="liveText">دریافت</span></span>
        <button type="button" class="icon-btn" id="refreshBtn" aria-label="بارگذاری دوباره">
          <svg id="refreshIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="تغییر زمینه"></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="side">
        <div class="side-top">
          <div class="stats">
            <button type="button" class="stat" id="statCount">
              <span>نمایش</span><b id="statCountVal">—</b>
            </button>
            <button type="button" class="stat" id="statStrong" disabled>
              <span>قوی‌ترین</span><b id="statStrongVal">—</b>
            </button>
            <button type="button" class="stat" id="statNew" disabled>
              <span>تازه‌ترین</span><b class="stat-ago" id="statNewVal">—</b>
            </button>
          </div>

          <div id="notableHost"></div>

          <p class="banner" id="banner" role="status" hidden></p>

          <div>
            <p class="kicker">گستره</p>
            <div class="seg" id="segRegion" role="group" aria-label="گستره"></div>
          </div>

          <div>
            <p class="kicker">بازه</p>
            <div class="seg" id="segTime" role="group" aria-label="بازه زمانی"></div>
          </div>

          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" placeholder="جستجوی مکان" aria-label="جستجوی مکان" autocomplete="off" />
            <button type="button" class="search-clear" id="searchClear" aria-label="پاک کردن جستجو" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </label>

          <div>
            <p class="kicker">حداقل بزرگی</p>
            <div class="seg" id="segMag" role="group" aria-label="حداقل بزرگی"></div>
          </div>

          <button type="button" class="more-btn" id="moreBtn" aria-expanded="false">تنظیم دقیق‌تر</button>

          <div class="advanced" id="advanced">
            <div>
              <div class="kicker row-between">
                <span>آستانهٔ دقیق</span>
                <span class="num" id="magValue">۳٫۰</span>
              </div>
              <label class="slider-label">
                <span class="sr">حداقل بزرگی</span>
                <input class="mag-range" id="magRange" type="range" min="0" max="8" step="0.1" value="3" />
              </label>
            </div>

            <div>
              <p class="kicker">عمق</p>
              <div class="seg" id="segDepth" role="group" aria-label="عمق"></div>
            </div>

            <div>
              <p class="kicker">توزیع بزرگی</p>
              <div id="chartHost"></div>
              <div class="legend" aria-label="راهنمای رنگ">
                <span class="legend-item"><i class="swatch tone-0"></i>زیر ۳</span>
                <span class="legend-item"><i class="swatch tone-1"></i>۳</span>
                <span class="legend-item"><i class="swatch tone-2"></i>۴</span>
                <span class="legend-item"><i class="swatch tone-3"></i>۵</span>
                <span class="legend-item"><i class="swatch tone-4"></i>۶+</span>
              </div>
            </div>
          </div>

          <div class="row-between">
            <p class="credit">
              منبع :
              <a href="https://earthquake.usgs.gov/" target="_blank" rel="noreferrer">USGS</a><span id="creditAgo"></span>
            </p>
            <button type="button" class="text-btn" id="resetBtn" disabled>بازنشانی</button>
          </div>
        </div>

        <div class="list-block">
          <div class="list-head">
            <p class="kicker tight">رویدادها <span class="count-inline" id="listCount">…</span></p>
            <div class="seg seg-slim" id="segSort" role="group" aria-label="مرتب‌سازی"></div>
          </div>
          <div class="q-list" id="qList"></div>
        </div>
      </aside>

      <section class="stage" id="stage">
        <div id="map" class="map-canvas" aria-label="نقشهٔ زمین‌لرزه‌ها"></div>
        <div class="stage-ui">
          <div class="map-tools">
            <div class="seg" id="segBase" role="group" aria-label="نقشه پایه"></div>
            <button type="button" class="icon-btn" id="fitBtn" aria-label="نمای کل">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
            </button>
            <button type="button" class="icon-btn" id="locateBtn" aria-label="نزدیک من">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="toast" id="toast" role="status" hidden></p>
          <div id="detailHost"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
